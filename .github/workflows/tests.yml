name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test extras
        run: |
          python -m pip install --upgrade pip
          pip install -e .[test]
      - name: Run test suite with 95% coverage gate
        run: |
          coverage run --source=src/evojump -m pytest tests/ -q
          coverage report --fail-under=95
